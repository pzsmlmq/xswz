<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>准大一 · 新生中转站</title>
    <meta name="description" content="准大一新生专属导航站，整合免费学习资源、四六级考研官网、AI备考工具，手机友好。">
    <link rel="preconnect" href="https://cn.bing.com">
    <style>
        :root {
            --bg: #f5f9ff;
            --card-bg: #ffffff;
            --card-border: #eef4fa;
            --card-shadow: 0 4px 12px rgba(0,20,40,0.04);
            --text-primary: #0b2b4a;
            --text-secondary: #5e6f8d;
            --text-muted: #7a8aa5;
            --accent: #1a5fb4;
            --accent-light: #d0e2ff;
            --accent-bg: rgba(74,144,217,0.06);
            --accent-bg-strong: #f0f7ff;
            --search-bg: #ffffff;
            --search-shadow: 0 8px 20px rgba(26,95,180,0.10);
            --feature-bg: linear-gradient(135deg, #e9f2ff, #ffffff);
            --feature-border: #1a5fb4;
            --divider: #e5edf5;
            --toast-bg: #0b2b4a;
            --toast-text: #ffffff;
            --coming-opacity: 0.6;
            --today-rec-glow: #f59e0b;
            --warning-bg: #fff8e1;
            --warning-text: #b45309;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1a2e;
                --card-bg: #18273f;
                --card-border: #1e3150;
                --card-shadow: 0 4px 12px rgba(0,0,0,0.20);
                --text-primary: #e2ecff;
                --text-secondary: #a0b8d8;
                --text-muted: #7d95b8;
                --accent: #5b9cf5;
                --accent-light: #1e3a60;
                --accent-bg: rgba(91,156,245,0.08);
                --accent-bg-strong: #15253d;
                --search-bg: #18273f;
                --search-shadow: 0 8px 20px rgba(0,0,0,0.30);
                --feature-bg: linear-gradient(135deg, #16253d, #18273f);
                --feature-border: #3a70c0;
                --divider: #1e3150;
                --toast-bg: #e2ecff;
                --toast-text: #0b2b4a;
                --coming-opacity: 0.45;
                --warning-bg: #2d1f0a;
                --warning-text: #fbbf24;
            }
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            padding: 20px 16px 40px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: system-ui, sans-serif;
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
        }
        .container { max-width: 560px; width: 100%; }
        .header h1 { font-size:28px; display:flex; align-items:center; gap:10px; }
        .header h1 .badge { background:var(--accent-light); color:var(--accent); font-size:13px; padding:3px 12px; border-radius:30px; }
        .search-box {
            background: var(--search-bg);
            border-radius: 30px;
            padding: 6px 6px 6px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            box-shadow: var(--search-shadow);
        }
        .search-box input { border:none; outline:none; flex:1; font-size:15px; background:transparent; color:var(--text-primary); }
        .search-box .search-btn { background:var(--accent); border:none; color:white; padding:10px 20px; border-radius:30px; font-size:15px; font-weight:600; cursor:pointer; }
        .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
        .card {
            background: var(--card-bg);
            padding: 16px 12px;
            border-radius: 18px;
            border: 1px solid var(--card-border);
            text-decoration: none;
            color: inherit;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .card .emoji { font-size:24px; margin-bottom:6px; }
        .card .name { font-weight:600; font-size:16px; }
        .card .desc { font-size:12px; color:var(--text-muted); }
        .footer { margin-top:30px; font-size:13px; color:var(--text-muted); text-align:center; border-top:1px solid var(--divider); padding-top:20px; }
        .toast { position:fixed; top:24px; left:50%; transform:translateX(-50%) translateY(-120px); background:var(--toast-bg); color:var(--toast-text); padding:12px 24px; border-radius:30px; font-size:14px; z-index:9999; transition:transform 0.35s; }
        .toast.show { transform:translateX(-50%) translateY(0); }
        @media (max-width:400px) { .grid { gap:10px; } .card { padding:14px 10px; min-height:70px; } }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎓 新生站 <span class="badge">免费学习版</span></h1>
            <p style="color:var(--text-secondary);">📌 精选免费资源 · 学校官网直达 · 考研择校工具</p>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索课程、技能或资源...">
            <button class="search-btn" id="searchBtn">快速跳转</button>
        </div>

        <div id="dynamic-sections"></div>

        <footer class="footer">
            <p>⚡ 新生中转站 · 免费学习导航</p>
            <p style="font-size:12px;">本站仅提供第三方网站链接导航，如有侵权或建议，请联系 <a href="mailto:3392188119@qq.com">3392188119@qq.com</a></p>
        </footer>
    </div>

    <script>
        // 这里放你的 linkData 和 render 函数
        // 由于版面原因，此处为简化演示，实际部署时请使用完整版
        const linkData = [
            { category: 'official', emoji: '📝', name: '四六级官网', desc: 'CET·考试院', url: 'https://www.neea.edu.cn/' },
            { category: 'official', emoji: '📚', name: '研招网', desc: '考研官方信息', url: 'https://yz.chsi.com.cn/' }
        ];
        const sections = [
            { id: 'grid-official', title: '官网直通车', category: 'official' }
        ];
        const container = document.getElementById('dynamic-sections');
        sections.forEach(sec => {
            const title = document.createElement('h2');
            title.textContent = sec.title;
            container.appendChild(title);
            const grid = document.createElement('div');
            grid.className = 'grid';
            linkData.filter(item => item.category === sec.category).forEach(item => {
                const card = document.createElement('a');
                card.className = 'card';
                card.href = item.url;
                card.target = '_blank';
                card.innerHTML = `<div class="emoji">${item.emoji}</div><div class="name">${item.name}</div><div class="desc">${item.desc}</div>`;
                grid.appendChild(card);
            });
            container.appendChild(grid);
        });
    </script>
</body>
</html>
